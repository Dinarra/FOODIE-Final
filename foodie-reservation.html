
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foodie — Reservation</title>
  <script>
    try {
      document.documentElement.setAttribute("data-bs-theme",
        localStorage.getItem("foodieTheme") === "dark" ? "dark" : "light");
    } catch (error) {}
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="foodie.css">
  <link rel="stylesheet" href="theme.css">
  <script src="reservation.js" defer></script>
  <script src="theme.js" defer></script>
</head>
<body>
<header class="site-header">
  <div class="logo">Food<span>ie</span></div>
  <nav class="main-nav">
    <ul>
      <li><a href="foodie-home.html">Home</a></li>
      <li><a href="foodie-menu.html">Menu</a></li>
      <li><a href="foodie-about.html">About</a></li>
      <li><a href="foodie-reservation.html" class="active" aria-current="page">Reservation</a></li>
      <li><a href="foodie-contact.html">Contact</a></li>
    </ul>
  </nav>
</header>

<main>
  <section class="section">
    <div class="container">
      <h1 class="text-center">Book a Table</h1>
      <p class="subtitle text-center">
        Reserve your table and enjoy a wonderful dining experience.
      </p>

      <form id="reservation-form" class="contact-form mx-auto" novalidate>
        <div class="mb-3">
          <label for="res-name" class="form-label">Full Name</label>
          <input type="text" id="res-name" name="name" class="form-control"
                 placeholder="Enter your full name" autocomplete="name">
        </div>

        <div class="mb-3">
          <label for="res-email" class="form-label">Email Address</label>
          <input type="email" id="res-email" name="email" class="form-control"
                 placeholder="Enter your email" autocomplete="email">
        </div>

        <div class="mb-3">
          <label for="res-phone" class="form-label">Phone Number</label>
          <input type="tel" id="res-phone" name="phone" class="form-control"
                 placeholder="+7 777 123 4567" autocomplete="tel">
        </div>

        <div class="row g-3 mb-3">
          <div class="col-12 col-md-6">
            <label for="res-date" class="form-label">Reservation Date</label>
            <input type="date" id="res-date" name="date" class="form-control">
          </div>

          <div class="col-12 col-md-6">
            <label for="res-time" class="form-label">Reservation Time</label>
            <input type="time" id="res-time" name="time" class="form-control">
          </div>
        </div>

        <div class="mb-3">
          <label for="res-guests" class="form-label">Number of Guests</label>
          <select id="res-guests" name="guests" class="form-select">
            <option value="">Select number of guests</option>
            <option value="1">1 Guest</option>
            <option value="2">2 Guests</option>
            <option value="3">3 Guests</option>
            <option value="4">4 Guests</option>
            <option value="5+">5+ Guests</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="res-comments" class="form-label">Special Requests (Optional)</label>
          <textarea id="res-comments" name="comments" class="form-control"
                    rows="4" placeholder="Any special requests?"></textarea>
        </div>

        <button type="submit" class="btn w-100">Book Now</button>
      </form>
      <p class="text-center small mt-3">
        Demo only. Reservations are not sent to a restaurant.
      </p>
    </div>
  </section>
</main>

<footer class="site-footer">
  <p>&copy; 2026 Foodie Restaurant. Student project — Final Assignment.</p>
</footer>
</body>
</html>
